server:
  port: 8080

spring:
  autoconfigure:
    exclude: org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration
  application:
    name: spring-ai
  profiles:
    active: dev
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: deepseek-r1:1.5b

    openai:
      api-key: sk-***
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

logging:
  level:
    root: INFO
    com.example: DEBUG